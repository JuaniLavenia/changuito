# Netlify builds the web app from the monorepo root. pnpm is detected from pnpm-lock.yaml
# and pinned by the root package.json "packageManager" field.
[build]
  command = "pnpm --filter @changuito/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/super, /stock, ...) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
